<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pertanyaan Penting!</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>
    <style>
        body {
            background: linear-gradient(135deg, #667eea, #764ba2);
            color: white;
            font-family: 'Poppins', sans-serif;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            overflow: hidden;
            margin: 0;
        }

        .card-custom {
            background: rgba(255, 255, 255, 0.1);
            backdrop-filter: blur(15px);
            border: 1px solid rgba(255, 255, 255, 0.2);
            border-radius: 20px;
            padding: 40px;
            box-shadow: 0 15px 35px rgba(0, 0, 0, 0.3);
            text-align: center;
            max-width: 450px;
            width: 90%;
            position: relative;
        }

        .btn-yes {
            background-color: #2ed573;
            color: white;
            font-weight: bold;
            padding: 12px 30px;
            border-radius: 30px;
            border: none;
            transition: all 0.2s ease;
            z-index: 10;
        }

        .btn-yes:hover {
            background-color: #26af5f;
            color: white;
        }

        .btn-no {
            background-color: #ff4757;
            color: white;
            font-weight: bold;
            padding: 12px 30px;
            border-radius: 30px;
            border: none;
            transition: all 0.15s ease;
            z-index: 20;
        }
    </style>
</head>
<body>

    <div class="card-custom">
        <div id="contentUtama">
            <h2 class="mb-4" id="pertanyaan">Jawab Jujur Ya... <br>Kamu Suka Traktir Aku Kan? 😜</h2>
            
            <div class="d-flex justify-content-center align-items-center gap-3 mt-4" style="min-height: 80px; position: relative;">
                <button class="btn btn-yes" id="btnYes" onclick="jawabIya()">IYA BANGET!</button>
                <button class="btn btn-no" id="btnNo" onclick="pindahTombol()">ENGGAK</button>
            </div>
        </div>

        <div id="contentHasil" style="display: none;">
            <h1 class="display-3">🎉 YAAAY! 🎉</h1>
            <h3 class="mt-3">Makasih yaaa! Ditunggu traktirannya hari ini! 🤣</h3>
            <button class="btn btn-outline-light rounded-pill mt-4" onclick="location.reload()">Ulangi</button>
        </div>
    </div>

    <script>
        let skalaYes = 1;
        let skalaNo = 1;

        function pindahTombol() {
            const btnNo = document.getElementById('btnNo');
            const btnYes = document.getElementById('btnYes');
            
            // Pindahkan posisi tombol ENGGAK ke titik acak di layar
            const x = Math.floor(Math.random() * (window.innerWidth - 120));
            const y = Math.floor(Math.random() * (window.innerHeight - 50));
            
            btnNo.style.position = 'fixed';
            btnNo.style.left = x + 'px';
            btnNo.style.top = y + 'px';

            // Setiap kali diklik, tombol ENGGAK mengecil, tombol IYA makin besar
            skalaNo -= 0.1;
            skalaYes += 0.25;

            if (skalaNo < 0.3) {
                skalaNo = 0.3; // Batas minimal biar nggak hilang total
            }

            btnNo.style.transform = `scale(${skalaNo})`;
            btnYes.style.transform = `scale(${skalaYes})`;
        }

        function jawabIya() {
            document.getElementById('contentUtama').style.display = 'none';
            document.getElementById('contentHasil').style.display = 'block';

            // Efek Kembang Api
            confetti({
                particleCount: 150,
                spread: 80,
                origin: { y: 0.6 }
            });
        }
    </script>
</body>
</html>
